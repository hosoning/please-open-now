<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>请在这时打开</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 首页：信箱陈列 -->
  <section id="home" class="screen active">
    <div class="header">
      <div class="logo">请在这时打开</div>
      <div class="names" id="display-names">
        <span id="user-name-display">你</span>
        <span class="dot">·</span>
        <span id="ta-name-display">TA</span>
      </div>
      <button class="icon-btn" id="edit-names-btn" aria-label="修改名字">✎</button>
    </div>

    <div class="mailbox-area">
      <div class="envelope-stack" id="envelope-stack">
        <!-- 信封将由 JS 动态生成 -->
      </div>
      <p class="hint">选择今天的心情，拆开一封来自 TA 的信</p>
    </div>

    <div class="mood-grid" id="mood-grid">
      <!-- 心情按钮由 JS 生成 -->
    </div>

    <div class="bottom-nav">
      <button class="nav-btn active" data-screen="home">信箱</button>
      <button class="nav-btn" data-screen="history">我们的信箱</button>
      <button class="nav-btn" data-screen="settings">设置</button>
    </div>
  </section>

  <!-- 拆信页 -->
  <section id="letter" class="screen">
    <div class="letter-header">
      <button class="back-btn" id="back-from-letter">←</button>
      <div class="letter-meta" id="letter-meta"></div>
    </div>
    <div class="letter-stage" id="letter-stage">
      <div class="envelope-closed" id="envelope-closed">
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <div class="seal"></div>
        </div>
      </div>
      <div class="letter-paper" id="letter-paper">
        <h2 class="letter-title" id="letter-title"></h2>
        <div class="letter-body" id="letter-body"></div>
        <div class="letter-actions">
          <button id="favorite-btn">收藏</button>
          <button id="share-btn">生成图片</button>
          <button id="close-letter">放回信箱</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 历史信箱 -->
  <section id="history" class="screen">
    <div class="header">
      <button class="back-btn" data-screen="home">←</button>
      <div class="logo">我们的信箱</div>
      <div></div>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="搜索信件或心情...">
    </div>
    <div class="history-list" id="history-list"></div>
    <div class="history-actions">
      <button id="export-btn">导出备份</button>
      <button id="import-btn">导入备份</button>
      <input type="file" id="import-file" accept=".json" hidden>
      <button id="clear-btn" class="danger">清空</button>
    </div>
  </section>

  <!-- 设置 -->
  <section id="settings" class="screen">
    <div class="header">
      <button class="back-btn" data-screen="home">←</button>
      <div class="logo">设置</div>
      <div></div>
    </div>
    <div class="settings-content">
      <div class="setting-item">
        <label>你的名字</label>
        <input type="text" id="input-user-name" placeholder="你的昵称">
      </div>
      <div class="setting-item">
        <label>TA 的名字</label>
        <input type="text" id="input-ta-name" placeholder="梦角名字">
      </div>
      <button id="save-names">保存</button>
      <div class="disclaimer">
        <p>这是一款虚构的角色代入式互动体验。</p>
        <p>所有信件均为人工撰写的虚构内容，并非来自任何真实人物的真实讯息。</p>
        <p>数据仅保存在你的浏览器本地，清除缓存或更换设备可能导致记录丢失。</p>
      </div>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
